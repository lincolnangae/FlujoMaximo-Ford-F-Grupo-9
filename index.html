<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de Red - Algoritmo de Ford-Fulkerson</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside id="panel-izquierdo">
    <h1>Flujo Máximo - Algoritmo de Ford-Fulkerson</h1>
    <hr>
    <h3>Configuración</h3>
    <div class="form-group">
      <label for="num-vertices">Vértices (7-16):</label>
      <input type="number" id="num-vertices" min="7" max="16" value="7">
      <button id="btn-aplicar">Aplicar</button>
    </div>

    <h3>Aristas</h3>
    <div class="form-group">
      <button id="btn-manual">Manual</button>
      <button id="btn-aleatorio">Aleatorio</button>
    </div>

    <div id="contenedor-manual">
      <div class="form-group">
        <label for="num-nodo-inicial">Nodo Inicial:</label>
        <input type="number" id="num-nodo-inicial" min="1" max="7" value="1">
      </div>
      <div class="form-group">
        <label for="num-nodo-final">Nodo Final:</label>
        <input type="number" id="num-nodo-final" min="1" max="7" value="2">
      </div>
      <div class="form-group">
        <label for="num-peso">Capacidad (1-9999):</label>
        <input type="number" id="num-peso" min="1" max="9999" value="1">
      </div>
      <div class="form-group">
        <button id="btn-conectar">Conectar</button>
      </div>
    </div>

    <h3>Fuente y Sumidero</h3>

    <div id="contenedor-fuente-sumidero">
      <div class="form-group">
        <label for="num-fuente">Fuente:</label>
        <input type="number" id="num-fuente" min="1" max="7">
      </div>
      <div class="form-group">
        <label for="num-sumidero">Sumidero:</label>
        <input type="number" id="num-sumidero" min="1" max="7">
      </div>
      <div class="form-group">
        <button id="btn-aceptar-fuente-sumidero">Aceptar</button>
      </div>
    </div>
  </aside>

  <main id="panel-derecho">
    <svg id="svg-red" viewBox="0 0 600 600">
      <defs>
        <marker id="flecha-negro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333" />
        </marker>
        <marker id="punto-inicio-negro" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
          <circle cx="5" cy="5" r="3.5" fill="#333333" />
        </marker>

        <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2e7d32" />
        </marker>
        <marker id="punto-inicio-verde" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
          <circle cx="5" cy="5" r="3.5" fill="#2e7d32" />
        </marker>

        <marker id="flecha-naranja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
          orient="auto">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f57c00" />
        </marker>
        <marker id="punto-inicio-naranja" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
          <circle cx="5" cy="5" r="3.5" fill="#f57c00" />
        </marker>

        <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c62828" />
        </marker>
        <marker id="punto-inicio-rojo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
          <circle cx="5" cy="5" r="3.5" fill="#c62828" />
        </marker>
      </defs>
      <g id="grupo-aristas"></g>
      <g id="grupo-nodos"></g>
    </svg>
  </main>

  <div id="overlay-advertencia">
    <div id="caja-advertencia">
      <h3 id="titulo-advertencia">Advertencia</h3>
      <p id="mensaje-advertencia">Estos datos no se permiten.</p>
      <button id="btn-cerrar-advertencia">Aceptar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
